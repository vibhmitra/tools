<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON to HTML &amp; CSV Converter</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #f9fafb;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    .panel {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .row + .row {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }
    input[type="file"] {
      font-size: 13px;
    }
    label.chk {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      cursor: pointer;
    }
    button {
      padding: 7px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111827;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #f3f4f6; }
    button.primary {
      background: #16a34a;
      border-color: #16a34a;
      color: #fff;
    }
    button.primary:hover { background: #15803d; }
    button.blue {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }
    button.blue:hover { background: #1d4ed8; }
    .status {
      font-size: 13px;
      color: #4b5563;
      margin-left: auto;
    }
    .error {
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 10px;
      font-size: 13px;
      display: none;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tabs button.active {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }
    .table-wrap {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      overflow: auto;
      max-height: 70vh;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    th {
      background: #f3f4f6;
      position: sticky;
      top: 0;
      font-weight: 600;
    }
    td.wrap {
      white-space: normal;
      min-width: 220px;
      max-width: 360px;
      word-break: break-word;
    }
    textarea.output {
      width: 100%;
      height: 65vh;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      resize: vertical;
    }
    .hidden { display: none; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Package JSON to HTML / CSV Converter</h1>
    <p>Download <a href="https://smartpack.github.io/PackageManager/" target="_blank">PackageManger</a> first to generate the apps JSON list.</p>
    <!-- Coverter for Json generated by Package Manager (sunilpaulmathew) app. | smartpack.github.io/PackageManager/ -->

    <div class="panel">
      <div class="row">
        <input id="file-input" type="file" accept=".json,application/json" />
        <label class="chk">
          <input id="opt-perms" type="checkbox" checked />
          Include Permissions
        </label>
        <label class="chk">
          <input id="opt-splits" type="checkbox" checked />
          Include Split APKs
        </label>
        <span id="status" class="status">Sample loaded (3 apps)</span>
      </div>

      <div class="row">
        <button id="btn-copy-sheets" type="button" class="primary">Copy for Google Sheets</button>
        <button id="btn-copy-csv" type="button">Copy CSV</button>
        <button id="btn-dl-csv" type="button">Download CSV</button>
        <button id="btn-copy-html" type="button">Copy HTML</button>
        <button id="btn-dl-html" type="button" class="blue">Download HTML</button>
      </div>

      <div id="error-box" class="error"></div>
    </div>

    <div class="tabs">
      <button id="tab-table" type="button" class="active">Table Preview</button>
      <button id="tab-csv" type="button">CSV Output</button>
      <button id="tab-html" type="button">HTML Output</button>
    </div>

    <div id="view-table" class="table-wrap"></div>
    <textarea id="view-csv" class="output hidden" readonly></textarea>
    <textarea id="view-html" class="output hidden" readonly></textarea>
  </div>

  <script>
    (function () {
      'use strict';

      const SAMPLE = {
        applications: [
          {
            "Name": "1DM+",
            "Package Name": "idm.internet.download.manager.plus",
            "Version": "17.2",
            "Google Play": "https://play.google.com/store/apps/details?id=idm.internet.download.manager.plus",
            "App Bundle": false,
            "APK Size": "21.78 MB",
            "Installed": "Feb 8, 2025 10:25:21 PM",
            "Last updated": "Feb 8, 2025 10:25:21 PM",
            "Permissions": { "Granted": ["android.permission.INTERNET", "android.permission.CAMERA"], "Denied": [] }
          },
          {
            "Name": "YouTube",
            "Package Name": "com.google.android.youtube",
            "Version": "21.47.483-BETA",
            "Google Play": "https://play.google.com/store/apps/details?id=com.google.android.youtube",
            "App Bundle": true,
            "Bundle Size": "144.65 MB",
            "Split APKs": ["base.apk", "split_config.xxhdpi.apk", "split_config.arm64_v8a.apk"],
            "Installed": "Jan 1, 2009 5:30:00 AM",
            "Last updated": "Nov 24, 2026 2:51:55 PM",
            "Permissions": { "Granted": ["android.permission.INTERNET", "android.permission.POST_NOTIFICATIONS"], "Denied": [] }
          },
          {
            "Name": "com.google.android.appsearch.apk",
            "Package Name": "com.google.android.appsearch.apk",
            "Google Play": "https://play.google.com/store/apps/details?id=com.google.android.appsearch.apk",
            "App Bundle": false,
            "APK Size": "340.9 KB",
            "Installed": "Jan 1, 1970 5:30:00 AM",
            "Last updated": "Jan 1, 1970 5:30:00 AM",
            "Permissions": { "Granted": ["android.permission.MANAGE_VIRTUAL_MACHINE"], "Denied": [] }
          }
        ]
      };

      const state = {
        rows: [],
        fileName: 'package_details',
        tab: 'table'
      };

      const fileInput = document.getElementById('file-input');
      const optPerms = document.getElementById('opt-perms');
      const optSplits = document.getElementById('opt-splits');
      const statusEl = document.getElementById('status');
      const errorBox = document.getElementById('error-box');

      const tabTable = document.getElementById('tab-table');
      const tabCsv = document.getElementById('tab-csv');
      const tabHtml = document.getElementById('tab-html');
      const viewTable = document.getElementById('view-table');
      const viewCsv = document.getElementById('view-csv');
      const viewHtml = document.getElementById('view-html');

      function escHtml(val) {
        return String(val == null ? '' : val)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function showError(msg) {
        if (!msg) {
          errorBox.style.display = 'none';
          errorBox.textContent = '';
        } else {
          errorBox.textContent = msg;
          errorBox.style.display = 'block';
        }
      }

      function normalize(parsed) {
        let list = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.applications) ? parsed.applications : null);
        if (!list && parsed && typeof parsed === 'object') {
          for (const k of Object.keys(parsed)) {
            if (Array.isArray(parsed[k])) { list = parsed[k]; break; }
          }
        }
        if (!list) throw new Error('Could not find an "applications" array in this JSON file.');

        return list.map((item) => {
          const a = item && typeof item === 'object' ? item : {};
          const isBundle = Boolean(a['App Bundle']);
          const size = isBundle ? (a['Bundle Size'] || a['APK Size'] || '') : (a['APK Size'] || a['Bundle Size'] || '');
          const splits = Array.isArray(a['Split APKs']) ? a['Split APKs'].map(String) : [];
          const perms = a['Permissions'] && typeof a['Permissions'] === 'object' ? a['Permissions'] : {};
          const granted = Array.isArray(perms['Granted']) ? perms['Granted'].map(String) : [];
          const denied = Array.isArray(perms['Denied']) ? perms['Denied'].map(String) : [];

          return {
            name: a['Name'] != null ? String(a['Name']) : '',
            pkg: a['Package Name'] != null ? String(a['Package Name']) : '',
            version: a['Version'] != null ? String(a['Version']) : '',
            bundle: isBundle ? 'Yes' : 'No',
            size: String(size),
            splits: splits.join('; '),
            installed: a['Installed'] != null ? String(a['Installed']) : '',
            updated: a['Last updated'] != null ? String(a['Last updated']) : '',
            grantedCount: granted.length,
            deniedCount: denied.length,
            granted: granted.join('; '),
            denied: denied.join('; '),
            play: a['Google Play'] != null ? String(a['Google Play']) : ''
          };
        });
      }

      function getColumns() {
        const cols = [
          { key: 'name', label: 'Name' },
          { key: 'pkg', label: 'Package Name' },
          { key: 'version', label: 'Version' },
          { key: 'bundle', label: 'App Bundle' },
          { key: 'size', label: 'Size' }
        ];
        if (optSplits.checked) {
          cols.push({ key: 'splits', label: 'Split APKs', wrap: true });
        }
        cols.push(
          { key: 'installed', label: 'Installed' },
          { key: 'updated', label: 'Last Updated' },
          { key: 'grantedCount', label: 'Granted Count' },
          { key: 'deniedCount', label: 'Denied Count' }
        );
        if (optPerms.checked) {
          cols.push(
            { key: 'granted', label: 'Granted Permissions', wrap: true },
            { key: 'denied', label: 'Denied Permissions', wrap: true }
          );
        }
        cols.push({ key: 'play', label: 'Google Play', isLink: true });
        return cols;
      }

      function csvCell(v) {
        const s = String(v == null ? '' : v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }

      function buildCsv() {
        const cols = getColumns();
        const lines = [cols.map(c => csvCell(c.label)).join(',')];
        for (let i = 0; i < state.rows.length; i++) {
          const r = state.rows[i];
          lines.push(cols.map(c => csvCell(r[c.key])).join(','));
        }
        return '\uFEFF' + lines.join('\r\n');
      }

      function buildTsv() {
        const cols = getColumns();
        const clean = (v) => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ');
        const lines = [cols.map(c => clean(c.label)).join('\t')];
        for (let i = 0; i < state.rows.length; i++) {
          const r = state.rows[i];
          lines.push(cols.map(c => clean(r[c.key])).join('\t'));
        }
        return lines.join('\n');
      }

      function buildTableHtml() {
        const cols = getColumns();
        const head = '<tr>' + cols.map(c => '<th>' + escHtml(c.label) + '</th>').join('') + '</tr>';
        const body = state.rows.map(r => {
          return '<tr>' + cols.map(c => {
            const val = r[c.key];
            if (c.isLink && val) {
              return '<td><a href="' + escHtml(val) + '" target="_blank" rel="noopener noreferrer">' + escHtml(val) + '</a></td>';
            }
            return '<td' + (c.wrap ? ' class="wrap"' : '') + '>' + escHtml(val) + '</td>';
          }).join('') + '</tr>';
        }).join('\n');
        return '<table><thead>' + head + '</thead><tbody>\n' + body + '\n</tbody></table>';
      }

      function buildStandaloneHtml() {
        return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8" />\n<title>' +
          escHtml(state.fileName) +
          '</title>\n<style>body{font-family:Arial,sans-serif;font-size:13px;margin:16px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}th{background:#f3f4f6}</style>\n</head>\n<body>\n' +
          buildTableHtml() +
          '\n</body>\n</html>';
      }

      function render() {
        tabTable.classList.toggle('active', state.tab === 'table');
        tabCsv.classList.toggle('active', state.tab === 'csv');
        tabHtml.classList.toggle('active', state.tab === 'html');

        viewTable.classList.toggle('hidden', state.tab !== 'table');
        viewCsv.classList.toggle('hidden', state.tab !== 'csv');
        viewHtml.classList.toggle('hidden', state.tab !== 'html');

        if (state.tab === 'table') {
          viewTable.innerHTML = buildTableHtml();
        } else if (state.tab === 'csv') {
          viewCsv.value = buildCsv().replace(/^\uFEFF/, '');
        } else {
          viewHtml.value = buildStandaloneHtml();
        }
      }

      function copyText(text, msg) {
        const done = () => {
          const prev = statusEl.textContent;
          statusEl.textContent = msg;
          setTimeout(() => { statusEl.textContent = prev; }, 2200);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      }

      function fallbackCopy(text, onDone) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        onDone();
      }

      function download(content, name, mime) {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function loadJson(parsed, filename, isSample) {
        try {
          state.rows = normalize(parsed);
          state.fileName = filename.replace(/\.json$/i, '').trim() || 'package_details';
          showError('');
          statusEl.textContent = (isSample ? 'Sample loaded: ' : filename + ': ') + state.rows.length + ' apps';
          render();
        } catch (err) {
          showError(err.message || 'Invalid JSON file.');
        }
      }

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            loadJson(JSON.parse(String(ev.target.result)), file.name, false);
          } catch (err) {
            showError('JSON parse error: ' + err.message);
          }
        };
        reader.readAsText(file, 'utf-8');
      });

      optPerms.addEventListener('change', render);
      optSplits.addEventListener('change', render);

      tabTable.addEventListener('click', () => { state.tab = 'table'; render(); });
      tabCsv.addEventListener('click', () => { state.tab = 'csv'; render(); });
      tabHtml.addEventListener('click', () => { state.tab = 'html'; render(); });

      document.getElementById('btn-copy-sheets').addEventListener('click', () => {
        copyText(buildTsv(), 'Copied! Press Ctrl+V in Google Sheets');
      });
      document.getElementById('btn-copy-csv').addEventListener('click', () => {
        copyText(buildCsv().replace(/^\uFEFF/, ''), 'CSV copied!');
      });
      document.getElementById('btn-dl-csv').addEventListener('click', () => {
        download(buildCsv(), state.fileName + '.csv', 'text/csv;charset=utf-8');
      });
      document.getElementById('btn-copy-html').addEventListener('click', () => {
        copyText(buildStandaloneHtml(), 'HTML copied!');
      });
      document.getElementById('btn-dl-html').addEventListener('click', () => {
        download(buildStandaloneHtml(), state.fileName + '.html', 'text/html;charset=utf-8');
      });

      loadJson(SAMPLE, 'package_details_sample.json', true);
    })();
  </script>
</body>
</html>
